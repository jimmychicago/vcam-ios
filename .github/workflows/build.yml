name: Build VCam

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash \
            curl \
            sudo \
            build-essential \
            fakeroot \
            git \
            perl \
            dpkg \
            xz-utils \
            unzip \
            zip \
            rsync

      - name: Install Theos + Toolchain + SDK
        run: |
          export THEOS=$HOME/theos

          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Verify Theos
        run: |
          echo "THEOS=$THEOS"

          echo "=== TOOLCHAIN ==="
          ls -lah $THEOS/toolchain/linux/iphone/bin || true

          echo "=== CLANG ==="
          $THEOS/toolchain/linux/iphone/bin/clang --version

          echo "=== SDKs ==="
          ls -lah $THEOS/sdks

      - name: Build package
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: List packages
        run: |
          find packages -type f -name "*.deb" -print

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: VCam-DEB
          path: packages/*.deb
